name: Traxio geolocation review
on:
  push:
    branches: [dev/traxio-mockup-fidelity]
    paths-ignore: ['mobile/**', 'scripts/*mobile*', 'scripts/android-smoke.mjs', '.github/workflows/mobile-build.yml', '.github/workflows/interface-review.yml', '.github/workflows/geolocation-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traxio-geolocation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geolocation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe existing public providers with a small diagnostic sample
        run: node scripts/geolocation-probe.mjs
      - name: Validate address evidence, route batching and provider security
        run: npm run test:geolocation
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify import, geocoding, route generation and GPS deviations
        run: npm test -- --project=desktop-light tests/geolocation.spec.js tests/live-geocoding.spec.js tests/live-navigation.spec.js tests/native-bridge.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traxio-geolocation-review
          retention-days: 14
          path: |
            test-results/
            playwright-report/
