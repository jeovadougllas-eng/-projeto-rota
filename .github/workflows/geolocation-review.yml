name: Traxio geolocation review
on:
  push:
    branches: [dev/traxio-mockup-fidelity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traxio-geolocation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geolocation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe existing public providers with a small diagnostic sample
        run: node scripts/geolocation-probe.mjs
