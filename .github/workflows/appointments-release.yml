name: RotaMapa appointments and reminders release
# Exercise appointment times, reminder lifecycle and stable wallet scope, including clients loaded after sign-in.
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/appointments-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rotamapa-appointments-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci && npm run check && npm run test:geolocation && node scripts/check-rotamapa-art.mjs
      - name: Install browser engines
        run: |
          browser_path=$(command -v google-chrome-stable || command -v google-chrome || true)
          if [ -n "$browser_path" ]; then echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"; else npx playwright install chromium; fi
          timeout 180s npx playwright install --with-deps webkit
      - run: npx playwright test --config=playwright.scheduling.config.js --max-failures=2
      - run: npx playwright test --config=playwright.premium.config.js --project=android-browser --project=iphone-safari --max-failures=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: appointments-browser
          path: |
            test-results-scheduling/
            test-results-premium/
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix mobile --ignore-scripts
      - name: Build current UI and RotaMapa launcher resources
        run: |
          TRAXELO_UPDATE_OUTPUT=candidate/updateweb node scripts/build-mobile.mjs
          cp candidate/updateweb/manifest.json candidate/update-manifest.json
      - run: npx cap sync android
        working-directory: mobile
      - run: bash gradlew assembleDebug
        working-directory: mobile/android
      - name: Verify package, label, complete bundle and original installer
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,os,subprocess
          assert hashlib.sha256(Path('downloads/traxio-android-testes.apk').read_bytes()).hexdigest()=='6d9fe54fc87beac1e1da5200858ab5232468449f40733548d58ad75139fdcdc2'
          m=json.loads(Path('candidate/update-manifest.json').read_text())
          apk='mobile/android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
            for name,digest in m['files'].items():assert hashlib.sha256(z.read('assets/public/'+name)).hexdigest()==digest,name
            assert 'data-tab="agendamentos"' in z.read('assets/public/index.html').decode()
            assert 'appointmentBell' in z.read('assets/public/assets/rotamapa-scheduling.js').decode()
            assert 'svg.classList.add' in z.read('assets/public/assets/traxio-ui.js').decode()
            assert 'stroke-width:2.2' in z.read('assets/public/assets/traxio.css').decode()
          aapt=sorted(Path(os.environ['ANDROID_HOME']).glob('build-tools/*/aapt'))[-1]
          badging=subprocess.check_output([str(aapt),'dump','badging',apk],text=True)
          assert "package: name='app.traxio.mobile'" in badging
          assert "application-label:'RotaMapa'" in badging
          print('Verified native RotaMapa label, stable package and',len(m['files']),'bundled files')
          PY
          mkdir -p candidate/apk updates/android/bundles
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk candidate/apk/rotamapa-android-testes.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appointments-candidates
          retention-days: 30
          path: |
            candidate/update-manifest.json
            candidate/updateweb/
            candidate/apk/rotamapa-android-testes.apk
  publish:
    needs: [browser, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: appointments-candidates
          path: candidate
      - name: Publish verified APK and compatible web update
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git diff --exit-code HEAD FETCH_HEAD -- index.html assets/ mobile/ scripts/ downloads/traxio-android-testes.apk
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p updates/android/bundles
          cp candidate/apk/rotamapa-android-testes.apk downloads/rotamapa-android-testes.apk
          cp candidate/updateweb/bundles/* updates/android/bundles/
          cp candidate/update-manifest.json updates/android/manifest.json
          cp candidate/update-manifest.json updates/android/candidate.json
          python - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,zipfile
          apk=Path('downloads/rotamapa-android-testes.apk');m=json.loads(Path('candidate/update-manifest.json').read_text())
          assert m['runtime']=='capacitor8-20261026' and m['nativeVersion']==2
          bundle=Path('updates/android/bundles')/(m['version']+'.zip')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest()==m['sha256']
          assert bundle.stat().st_size==m['bytes']
          with zipfile.ZipFile(apk) as z:
            for name,digest in m['files'].items():assert hashlib.sha256(z.read('assets/public/'+name)).hexdigest()==digest,name
          assert hashlib.sha256(Path('downloads/traxio-android-testes.apk').read_bytes()).hexdigest()=='6d9fe54fc87beac1e1da5200858ab5232468449f40733548d58ad75139fdcdc2'
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('downloads/rotamapa-android-testes.sha256').write_text(digest+'  rotamapa-android-testes.apk\n')
          Path('downloads/rotamapa-android-testes.json').write_text(json.dumps({'name':'RotaMapa','packageId':'app.traxio.mobile','release':m['version'],'sha256':digest,'bytes':apk.stat().st_size,'purpose':'first_installation','existingInstallations':'Keep the installed app and its local data. Use its compatible web update. Launcher resources require a compatibly signed native package.'},indent=2))
          print('Verified APK and compatible update:',m['version'],len(m['files']),'files')
          PYTHON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/rotamapa-android-testes.* updates/android/manifest.json updates/android/candidate.json updates/android/bundles/
          git commit -m "build: publish appointments, reminders and scheduled route planning [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
