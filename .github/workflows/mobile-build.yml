name: Traxio Android
on:
  push:
    branches: [dev/traxio-mockup-fidelity]
    paths: ['mobile/**', 'index.html', 'assets/**', 'scripts/*mobile*', 'scripts/android-smoke.mjs', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: traxio-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix mobile --ignore-scripts
      - run: node scripts/build-mobile.mjs
      - run: npm run prepare:platforms --prefix mobile
      - name: Preserve reproducible native projects and exact dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json mobile/android
          if ! git diff --cached --quiet; then
            git commit -m "build: update Traxio Android project [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: traxio-native-source
          retention-days: 30
          path: |
            mobile/
            !mobile/node_modules/
            !mobile/www/
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/traxio-mockup-fidelity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix mobile --ignore-scripts
      - run: node scripts/build-mobile.mjs
      - run: npx cap sync android
        working-directory: mobile
      - run: bash gradlew assembleDebug
        working-directory: mobile/android
      - run: npm ci
      - run: sudo chmod a+rw /dev/kvm
      - name: Install and exercise the APK in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure location_mode 3
            adb emu geo fix -35.211 -5.795
            node scripts/android-smoke.mjs
      - name: Preserve the tested APK and runtime evidence on the development branch
        run: |
          mkdir -p downloads docs/captures/android
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk downloads/traxio-android-testes.apk
          sha256sum downloads/traxio-android-testes.apk > downloads/traxio-android-testes.sha256
          cp mobile/evidence/* docs/captures/android/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ docs/captures/android/
          git commit -m "build: publish tested Android APK and native GPS evidence [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traxio-android-runtime-evidence
          retention-days: 30
          path: mobile/evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: traxio-android-debug-apk
          retention-days: 30
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
