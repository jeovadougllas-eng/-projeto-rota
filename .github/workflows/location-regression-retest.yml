name: Full functional regression after direct map confirmation
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/location-regression-retest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Use installed Chrome
        run: |
          browser_path=$(command -v google-chrome-stable || command -v google-chrome || true)
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Existing authentication, imports, GPS recalculation, native bridge and direct pin persistence
        run: npx playwright test tests/auth.spec.js tests/flows.spec.js tests/geolocation.spec.js tests/native-bridge.spec.js --workers=4
      - name: Real street routing on desktop and tablets
        run: npx playwright test tests/routes-live.spec.js --project=desktop-light --project=tablet-portrait-light --project=tablet-landscape-dark --workers=1
      - name: Real public geocoder with the existing non-customer test address
        run: npx playwright test tests/live-geocoding.spec.js --project=desktop-light
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-full-regression-evidence
          retention-days: 30
          path: |
            test-results/
            playwright-report/
            docs/captures/routes-after/
