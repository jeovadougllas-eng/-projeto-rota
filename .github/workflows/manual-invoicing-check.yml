name: Verify explicit manual invoicing compatibility
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/manual-invoicing-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm run check && node scripts/check-rotamapa-art.mjs
      - run: node --test test-unit/*.test.mjs
      - name: Use installed Chrome
        run: |
          browser_path=$(command -v google-chrome-stable || command -v google-chrome)
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: npx playwright test --config=playwright.ranking.config.js --project=desktop --project=android-browser --max-failures=1
