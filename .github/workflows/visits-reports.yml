name: Confirmed visits, monthly projection and Excel charts
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['assets/traxelo-visits*','assets/traxelo-visit-*','tests/visits.spec.js','test-unit/visits*','test-unit/visit-*','playwright.visits.config.js','scripts/visit-workbook-fixture.mjs','scripts/verify-visit-workbook.py','test-db/**','docs/sql/enable-visit-*.sql','.github/workflows/visits-reports.yml','index.html']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visits-reports-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run check && npm run test:geolocation
      - name: Use installed Chrome
        run: |
          browser_path=$(command -v google-chrome-stable || command -v google-chrome || true)
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: npx playwright test --config=playwright.visits.config.js --project=desktop --project=tablet --project=phone
      - name: Validate actual Excel package and editable charts
        run: |
          python -m pip install --quiet openpyxl==3.1.5
          node scripts/visit-workbook-fixture.mjs
          python scripts/verify-visit-workbook.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visits-report-evidence
          retention-days: 30
          path: test-results-visits/

  database-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: visits_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only-password
      PGDATABASE: visits_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Test real RLS and column privileges in an isolated database; never connect to production
        run: |
          psql -v ON_ERROR_STOP=1 -f test-db/visits-fixture.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/enable-visit-history.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/enable-visit-exports.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/enable-visit-history.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/enable-visit-exports.sql
          psql -v ON_ERROR_STOP=1 -f test-db/visits-rls.sql
