name: iPhone PWA installation, privacy and native separation
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['assets/traxelo-iphone-pwa.*','assets/iphone/**','iphone*','tests/iphone-pwa.spec.js','playwright.iphone.config.js','.github/workflows/iphone-pwa.yml','scripts/build-mobile.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iphone-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run check && node --test test-unit/iphone-pwa.test.mjs
      - name: Prepare browser engines with bounded installation
        run: |
          browser_path=$(command -v google-chrome-stable || command -v google-chrome || true)
          if [ -n "$browser_path" ]; then echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"; else npx playwright install chromium; fi
          timeout 180s npx playwright install --with-deps webkit
      - run: npx playwright test --config=playwright.iphone.config.js --max-failures=2
      - name: Confirm native HTML excludes PWA metadata and installation code; preserve active APK and update
        run: |
          npm ci --prefix mobile --ignore-scripts
          TRAXELO_UPDATE_OUTPUT=/tmp/traxelo-iphone-native-check node scripts/build-mobile.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const html=await readFile('mobile/www/index.html','utf8');assert.ok(!html.includes('iphone.webmanifest'));assert.ok(!html.includes('traxelo-iphone-pwa.js'));assert.ok(!html.includes('traxelo-iphone-pwa.css'));assert.ok(!html.includes('apple-mobile-web-app-capable'));
          assert.equal(createHash('sha256').update(await readFile('downloads/traxio-android-testes.apk')).digest('hex'),'6d9fe54fc87beac1e1da5200858ab5232468449f40733548d58ad75139fdcdc2');
          assert.equal(JSON.parse(await readFile('updates/android/manifest.json','utf8')).version,'cc6c358d48d27b8b44ba5cfd3343813f0c7907d0982a172dcda59017efcc295b');console.log('iPhone PWA is web-only. Original APK and active Android update preserved.');
          JS
      - name: Preserve passing iPhone screenshots with synthetic accounts only
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('docs/captures/iphone');root.mkdir(parents=True,exist_ok=True)
          for image in Path('test-results-iphone').rglob('*.png'):
            if image.name in ['iphone-header-install.png','iphone-login-install.png','iphone-install-instructions.png','iphone-offline-notice.png']:
              device=next((x for x in ['iphone-safari','iphone-chrome','iphone-small','iphone-landscape'] if image.parent.name.endswith(x)),None)
              if device: shutil.copyfile(image,root/(device+'-'+image.name))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/captures/iphone/
          if ! git diff --cached --quiet; then
            git commit -m "test: capture iPhone PWA installation before and after login [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-pwa-evidence
          retention-days: 30
          path: test-results-iphone/
