name: RotaMapa Top 5 Clients and Products Ranking release
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/ranking-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rotamapa-ranking-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm run check && node scripts/check-rotamapa-art.mjs
      - run: node --test test-unit/buyers.test.mjs test-unit/buyer-api.test.mjs test-unit/ranking-top5.test.mjs test-unit/billing.test.mjs test-unit/commerce.test.mjs
      - name: Use the installed Chrome engine
        run: |
          browser_path=$(command -v google-chrome-stable || command -v google-chrome)
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: npx playwright test --config=playwright.ranking.config.js --project=desktop --project=android-browser --project=tablet-vertical --project=tablet-horizontal --max-failures=2
      - run: npx playwright test --config=playwright.management.config.js --project=desktop --project=android-browser tests/buyer-routes.spec.js --max-failures=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ranking-browser
          path: |
            test-results-ranking/
            test-results-management/
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.android/debug.keystore
          key: traxelo-test-debug-signing-v1
      - run: npm ci --prefix mobile --ignore-scripts
      - run: TRAXELO_RELEASE_TAG=ranking-1.5.0 TRAXELO_UPDATE_OUTPUT=candidate/updateweb node scripts/build-mobile.mjs
      - run: npx cap sync android
        working-directory: mobile
      - run: bash gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - run: python scripts/verify-ranking-apk.py
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk candidate/rotamapa-android-1.5.0-testes.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ranking-candidate
          retention-days: 30
          path: candidate/
  publish:
    needs: [browser, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ranking-candidate
          path: candidate
      - name: Publish only the verified source and matching artifacts
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          cp candidate/rotamapa-android-1.5.0-testes.apk downloads/
          cp candidate/updateweb/bundles/* updates/android/bundles/
          cp candidate/updateweb/manifest.json updates/android/manifest.json
          cp candidate/updateweb/manifest.json updates/android/candidate.json
          cp candidate/ranking-release-proof.json docs/ranking-top5-release-verification.json
          python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          p=json.loads(Path('candidate/ranking-release-proof.json').read_text())
          assert hashlib.sha256(Path('downloads/rotamapa-android-1.5.0-testes.apk').read_bytes()).hexdigest()==p['apkSha256']
          if p['inPlaceUpgradeFromStable']:shutil.copyfile('candidate/rotamapa-android-1.5.0-testes.apk','downloads/rotamapa-android-testes.apk')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/rotamapa-android-1.5.0-testes.apk downloads/rotamapa-android-testes.apk updates/android/ docs/ranking-top5-release-verification.json
          git commit -m "build: publish verified Top 5 Clients and Products Ranking APK and Android update [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
