name: Approved brand, shared sidebar and confirmed portfolio
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/portfolio-readiness.yml','tests/portfolio-*.spec.js','assets/traxio-ui.js','assets/traxelo-shell.css','assets/traxelo/**','assets/scenes/**','assets/traxelo-glass.css','tests/scenic-shell.spec.js','index.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm run test:geolocation
      - name: Confirmed-only planning, branding and five-screen geometry in eight profiles
        run: npx playwright test tests/portfolio-readiness.spec.js tests/scenic-shell.spec.js --workers=2
      - name: Reproduce the previous missing scenery on four tabs
        run: |
          git fetch --depth=1 origin 8922d95d51a8c6218134886c920380b84afe91ae
          mkdir -p /tmp/traxelo-portfolio-before
          git archive 8922d95d51a8c6218134886c920380b84afe91ae | tar -x -C /tmp/traxelo-portfolio-before
          PORT=4174 node /tmp/traxelo-portfolio-before/scripts/serve.mjs &
          before_pid=$!
          trap 'kill "$before_pid"' EXIT
          TRAXIO_PORTFOLIO_BEFORE=1 npx playwright test tests/portfolio-before.spec.js --project=desktop-light --project=tablet-portrait-light --project=tablet-landscape-dark --workers=1
      - name: Preserve visual evidence on the isolated development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/captures/portfolio-before/ docs/captures/portfolio-after/ docs/captures/scenic-after/
          if ! git diff --cached --quiet; then
            git commit -m "test: preserve brand and shared sidebar before and after evidence [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-readiness-evidence
          retention-days: 30
          path: |
            test-results/
            playwright-report/
            docs/captures/portfolio-before/
            docs/captures/portfolio-after/
            docs/captures/scenic-after/
