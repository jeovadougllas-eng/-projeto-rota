name: Traxelo OAuth return review
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/preview-auth-review.yml', 'scripts/preview-auth-probe.mjs']
permissions:
  contents: read
jobs:
  redirect-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify web and Android return URLs without a personal login
        run: node scripts/preview-auth-probe.mjs
