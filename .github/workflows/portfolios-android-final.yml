name: RotaMapa verified portfolio APK installation
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/portfolios-android-final.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: rotamapa-portfolios-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-android:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify browser/build proof and identical application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYPROOF'
          import json,subprocess
          j=json.loads(subprocess.check_output(['gh','api','repos/jeovadougllas-eng/-projeto-rota/actions/runs/40912851534/jobs'],text=True))
          jobs={i['name']:i['conclusion'] for i in j['jobs']}
          assert all(jobs.get(k)=='success' for k in ('browser','build','database')),jobs
          print('Existing source proof: complete browser suite, additive database migration and APK bundle verification passed.')
          PYPROOF
          git fetch --depth=1 origin b84bc838344603588666268e354e82d7cabeb864
          git diff --exit-code b84bc838344603588666268e354e82d7cabeb864 HEAD -- index.html assets/ mobile/native/ mobile/capacitor.config.json scripts/build-mobile.mjs scripts/prepare-rotamapa-brand.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portfolios-candidates
          path: candidate
          run-id: 40912851534
          github-token: ${{ github.token }}
      - run: npm ci
      - name: Prepare isolated emulator renderer
        run: |
          sudo chmod a+rw /dev/kvm
          Xvfb :99 -screen 0 1920x1200x24 -ac > /tmp/rotamapa-xvfb.log 2>&1 &
      - name: Verify existing installation and first-install APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 -feature -Vulkan
          script: |
            adb shell wm size 1200x1920
            adb shell wm density 240
            adb install downloads/traxio-android-testes.apk
            adb shell am start -n app.traxio.mobile/.MainActivity
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
            adb shell run-as app.traxio.mobile mkdir -p shared_prefs
            ROTAMAPA_COMMERCE_PROOF=1 ROTAMAPA_CAMERA_PROOF=1 TRAXELO_VISITS_PROOF=1 TRAXELO_FIELD_NAVIGATION_PROOF=1 TRAXELO_PREMIUM_PROOF=1 TRAXELO_INTERFACE_THEME_PROOF=1 node scripts/android-updates.mjs
            adb uninstall app.traxio.mobile
            adb install candidate/apk/rotamapa-android-testes.apk
            adb shell run-as app.traxio.mobile mkdir -p shared_prefs
            adb shell run-as app.traxio.mobile cp /data/local/tmp/traxelo-ota-qa.xml shared_prefs/traxelo_web_releases_v1.xml
            adb shell am start -n app.traxio.mobile/.MainActivity
            adb shell settings put secure location_mode 3
            node scripts/android-smoke.mjs
            ROTAMAPA_COMMERCE_PROOF=1 ROTAMAPA_CAMERA_PROOF=1 node scripts/android-fresh-interface.mjs
      - name: Publish only Android-tested artifacts
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git diff --exit-code HEAD FETCH_HEAD -- index.html assets/ mobile/native/ mobile/capacitor.config.json scripts/build-mobile.mjs scripts/prepare-rotamapa-brand.mjs downloads/traxio-android-testes.apk
          mkdir -p downloads docs/captures/portfolios-android
          cp candidate/apk/rotamapa-android-testes.apk downloads/rotamapa-android-testes.apk
          cp candidate/update-manifest.json updates/android/manifest.json
          cp mobile/evidence/* docs/captures/portfolios-android/
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          apk=Path('downloads/rotamapa-android-testes.apk');m=json.loads(Path('candidate/update-manifest.json').read_text())
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('downloads/rotamapa-android-testes.sha256').write_text(digest+'  rotamapa-android-testes.apk\n')
          Path('downloads/rotamapa-android-testes.json').write_text(json.dumps({'name':'RotaMapa','packageId':'app.traxio.mobile','release':m['version'],'sha256':digest,'bytes':apk.stat().st_size,'purpose':'first_installation','existingInstallations':'Keep the installed app and its local data. Use its compatible web update. Launcher resources require a compatibly signed native package.'},indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/rotamapa-android-testes.* updates/android/manifest.json docs/captures/portfolios-android/
          git commit -m "build: publish tested RotaMapa portfolios and history APK [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portfolios-installed-android
          path: mobile/evidence/
