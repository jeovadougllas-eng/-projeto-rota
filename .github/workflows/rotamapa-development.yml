name: RotaMapa development validation (no production)
on:
  push:
    branches: [dev/rotamapa-atualizacao-integral]
    paths: ['assets/**', 'index.html', 'mobile/**', 'scripts/**', 'tests/**', 'test-unit/**', 'test-db/**', 'supabase/migrations/**', 'playwright*.js', 'package*.json', '.github/workflows/rotamapa-development.yml']
  workflow_dispatch:
    inputs:
      verify_installed_update:
        description: Verify the published update inside the existing signed Android app
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rotamapa-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-and-build:
    if: github.ref == 'refs/heads/dev/rotamapa-atualizacao-integral' && !inputs.verify_installed_update
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: git switch --no-track -c dev/rotamapa-atualizacao-integral
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && node scripts/check-rotamapa-art.mjs && node scripts/check-document-assets.mjs
      - run: node --test test-unit/*.test.mjs
      - name: Build the allowlisted public Preview runtime
        run: node scripts/build-preview-runtime.mjs
        env:
          GITHUB_REF_NAME: dev/rotamapa-atualizacao-integral
      - name: Verify the authorized public release and compatible Android update
        run: node scripts/build-public-runtime.mjs
      - name: Isolated PostgreSQL schema and RLS assertions
        run: bash scripts/test-portfolio-lifecycle-db.sh
      - name: Browser regressions with synthetic data only
        run: |
          browser_path=$(command -v google-chrome-stable || command -v google-chrome)
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$browser_path" npx playwright test tests/document-library.spec.js tests/catalog-viewer.spec.js tests/auth.spec.js tests/client-import.spec.js tests/portfolio-lifecycle.spec.js tests/remote-orders.spec.js tests/subscriptions.spec.js --project=desktop-light --project=phone-dark --workers=2 --timeout=45000
      - name: Real service-worker recovery with synthetic portfolio (Chromium, simulated iPhone UI)
        run: |
          browser_path=$(command -v google-chrome-stable || command -v google-chrome)
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$browser_path" npx playwright test --config=playwright.development-pwa.config.js
      - name: Restore existing test signing identity if this branch can access it
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.android/debug.keystore
          key: traxelo-test-debug-signing-v1
      - run: npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-mobile.mjs
      - run: ./node_modules/.bin/cap sync android
        working-directory: mobile
      - name: Install required Android SDK packages
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'
      - run: bash gradlew assembleRelease --no-daemon --max-workers=2
        working-directory: mobile/android
      - name: Preserve signed artifact only if it matches the production APK certificate
        run: python3 scripts/prepare-development-apk.py
        env:
          ROTAMAPA_ANDROID_OUTPUT: ${{ runner.temp }}/rotamapa-android
          ROTAMAPA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ROTAMAPA_ANDROID_KEYSTORE_BASE64 }}
          ROTAMAPA_ANDROID_KEY_ALIAS: ${{ secrets.ROTAMAPA_ANDROID_KEY_ALIAS }}
          ROTAMAPA_ANDROID_STORE_PASSWORD: ${{ secrets.ROTAMAPA_ANDROID_STORE_PASSWORD }}
          ROTAMAPA_ANDROID_KEY_PASSWORD: ${{ secrets.ROTAMAPA_ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rotamapa-development-${{ github.sha }}
          retention-days: 30
          path: ${{ runner.temp }}/rotamapa-android/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: rotamapa-development-test-results-${{ github.sha }}
          retention-days: 7
          path: test-results/
  installed-update:
    if: github.ref == 'refs/heads/dev/rotamapa-atualizacao-integral' && github.event_name == 'workflow_dispatch' && inputs.verify_installed_update
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require exact published candidate before touching the synthetic emulator
        run: |
          mkdir -p candidate
          cp updates/android/manifest.json candidate/update-manifest.json
          curl --fail --silent --show-error https://traxio-preview.vercel.app/updates/android/candidate.json -o candidate/published.json
          cmp candidate/update-manifest.json candidate/published.json
          sudo chmod a+rw /dev/kvm
          Xvfb :99 -screen 0 1920x1200x24 -ac > /tmp/rotamapa-xvfb.log 2>&1 &
      - name: Install the existing signed APK and verify real OTA preservation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 -feature -Vulkan
          script: |
            adb install downloads/rotamapa-android-1.7.0-testes.apk
            adb shell am start -n app.traxio.mobile/.MainActivity
            adb shell run-as app.traxio.mobile mkdir -p shared_prefs
            node scripts/android-updates.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rotamapa-installed-update-${{ github.sha }}
          path: mobile/evidence/
