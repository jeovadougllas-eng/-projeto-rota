name: Verify published location release, original APK and active Android update
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/location-release-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify active web files, immutable bundle, unchanged APK and screenshots over public HTTPS
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const root='https://traxio-preview.vercel.app';
          const digest=b=>createHash('sha256').update(b).digest('hex');
          async function get(path){const r=await fetch(root+path,{signal:AbortSignal.timeout(45000)});assert.equal(r.status,200,path);return r;}
          const html=await (await get('/')).text();assert.ok(html.includes('assets/traxelo-location-ui.js'));
          const manifest=await (await get('/updates/android/manifest.json')).json();assert.equal(manifest.version,'8e8f93d69949e7e1633176b2491be43be8ee90c6c80ddb95a5fb1e6c15a57cae');assert.equal(manifest.packageId,'app.traxio.mobile');
          const archive=Buffer.from(await (await get(manifest.bundle)).arrayBuffer());assert.equal(archive.length,manifest.bytes);assert.equal(digest(archive),manifest.sha256);
          const files=Object.entries(manifest.files);
          for(let i=0;i<files.length;i+=4)await Promise.all(files.slice(i,i+4).map(async([path,hash])=>{const r=await get('/'+path);const bytes=Buffer.from(await r.arrayBuffer());if(path==='index.html')return;assert.equal(digest(bytes),hash,path);}));
          const apk=Buffer.from(await (await get('/downloads/traxio-android-testes.apk')).arrayBuffer());assert.equal(digest(apk),'6d9fe54fc87beac1e1da5200858ab5232468449f40733548d58ad75139fdcdc2');
          const evidence=await (await get('/docs/captures/location-android/android-updates.json')).json();assert.equal(evidence.expected,manifest.version);assert.equal(evidence.checks.length,8);assert.ok(!evidence.error);
          for(const name of ['android-location-tablet.png','android-location-landscape-menu.png']){const b=Buffer.from(await (await get('/docs/captures/location-android/'+name)).arrayBuffer());assert.ok(b.length>50000);assert.equal(b.subarray(1,4).toString(),'PNG');}
          assert.ok((await (await get('/docs/location-workflow-review.html')).text()).includes('confirmação direta'));
          const status=await (await get('/api/geolocation-benchmark')).json();assert.deepEqual(status.configured,{geoapify:true,tomtom:true});
          console.log(JSON.stringify({website:200,manifestVersion:manifest.version,validatedFiles:files.length-1,indexDifference:'native meta tag only; UI covered by published browser tests',archiveBytes:archive.length,archiveSHA256:manifest.sha256,apkBytes:apk.length,apkUnchanged:true,nativeChecks:evidence.checks.length,screenshotsVerified:2,realCustomerDataUsed:false,providerQueriesPerformed:false}));
          JS
