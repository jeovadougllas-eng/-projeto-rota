name: Traxelo published routes and APK check
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/deployment-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the public website and download the tested APK
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const base='https://traxio-preview.vercel.app';
          const expected=(await readFile('downloads/traxio-android-testes.sha256','utf8')).split(/\s+/)[0];
          const request=path=>fetch(base+path,{signal:AbortSignal.timeout(60000)});
          const home=await request('/');assert.equal(home.status,200);
          const html=await home.text();assert.ok(html.includes('assets/traxio-route-ui.js'));assert.ok(html.includes('Traxelo.IA'));assert.ok(html.includes('openGoogleMaps'));assert.ok(html.includes('openWaze'));
          const sdk=await request('/assets/traxio-geolocation.js');assert.equal(sdk.status,200);assert.ok((await sdk.text()).includes('digits(clean(c.cep)||field'));
          for(const path of ['index.html','assets/traxio-route-ui.js','assets/traxio-planner.js','assets/traxio-geolocation.js','assets/traxio-routes.css']){
            const response=await request('/'+path);assert.equal(response.status,200);
            const served=Buffer.from(await response.arrayBuffer()),local=await readFile(path);
            assert.equal(createHash('sha256').update(served).digest('hex'),createHash('sha256').update(local).digest('hex'),'Published file mismatch: '+path);
          }
          for(const path of ['/docs/routing-review.html','/docs/captures/routes-after/tablet-portrait-light.png','/docs/captures/android/android-routes.json']){
            const response=await request(path);assert.equal(response.status,200);
          }
          const apk=await request('/downloads/traxio-android-testes.apk');assert.equal(apk.status,200);
          assert.ok(apk.headers.get('content-type').includes('application/vnd.android.package-archive'));assert.ok(apk.headers.get('content-disposition').includes('attachment'));assert.ok(apk.headers.get('cache-control').includes('no-store'));
          const bytes=Buffer.from(await apk.arrayBuffer());assert.ok(bytes.length>1000000);
          const sha=createHash('sha256').update(bytes).digest('hex');assert.equal(sha,expected);
          await writeFile('/tmp/traxelo-verified.apk',bytes);
          for(const file of ['traxio-route-ui.js','traxio-planner.js','traxio-geolocation.js','traxio-routes.css']){
            const bundled=execFileSync('unzip',['-p','/tmp/traxelo-verified.apk','assets/public/assets/'+file],{maxBuffer:2000000}),local=await readFile('assets/'+file);
            assert.equal(createHash('sha256').update(bundled).digest('hex'),createHash('sha256').update(local).digest('hex'),'APK/web mismatch: '+file);
          }
          const bundledHTML=execFileSync('unzip',['-p','/tmp/traxelo-verified.apk','assets/public/index.html'],{maxBuffer:2000000});
          const expectedHTML=(await readFile('index.html','utf8')).replace('<script src="assets/traxio-native.js"></script>','<script src="assets/capacitor-runtime.js"></script><script src="assets/traxio-native.js"></script>');
          assert.equal(createHash('sha256').update(bundledHTML).digest('hex'),createHash('sha256').update(expectedHTML).digest('hex'),'APK HTML differs from tested source');
          const manifest=await request('/downloads/traxio-android-testes.sha256');assert.equal(manifest.status,200);assert.ok((await manifest.text()).startsWith(expected));
          const api=await request('/api/geocode');assert.equal(api.status,405);
          console.log(JSON.stringify({website:200,geocoderSDK:200,apk:200,apkBytes:bytes.length,sha256:sha,serverEndpoint:405,publicAccess:true,apkAndWebAssetsMatch:true}));
          NODE
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the published tablet and desktop route flow in the browser
        run: TRAXIO_PUBLISHED=1 npx playwright test --config=playwright.published.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traxelo-published-verification
          retention-days: 30
          path: test-results-published/
  oauth-return:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify web and Android Google OAuth return URLs
        run: node scripts/preview-auth-probe.mjs
