name: Client address fields, networks and installed iPhone safe layout
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/client-fields.yml','tests/client-fields.spec.js','playwright.client-fields.config.js','test-unit/client-address.test.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: client-fields-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run check && npm run test:geolocation
      - name: Browser engines
        run: |
          browser_path=$(command -v google-chrome-stable || command -v google-chrome || true)
          if [ -n "$browser_path" ]; then echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"; else npx playwright install chromium; fi
          timeout 180s npx playwright install --with-deps webkit
      - run: npx playwright test --config=playwright.client-fields.config.js --max-failures=2
      - name: Preserve synthetic-account screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('docs/captures/client-fields');root.mkdir(parents=True,exist_ok=True)
          for image in Path('test-results-client-fields').rglob('*.png'):
            if image.name in ['client-separated-fields.png','filtered-client-bar.png','iphone-standalone-safe-header.png']:
              device=next((x for x in ['iphone-safari','iphone-chrome','iphone-small','iphone-landscape','android-browser','desktop'] if image.parent.name.endswith(x)),None)
              if device: shutil.copyfile(image,root/(device+'-'+image.name))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/captures/client-fields/
          if ! git diff --cached --quiet; then
            git commit -m "test: capture separated client address and installed iPhone safe header [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-fields-browser-evidence
          path: test-results-client-fields/
  stage-android:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm ci --prefix mobile --ignore-scripts
      - name: Build compatible web update without replacing signed APK
        run: |
          TRAXELO_UPDATE_OUTPUT=candidate/updateweb node scripts/build-mobile.mjs
          mkdir -p updates/android/bundles
          cp candidate/updateweb/bundles/* updates/android/bundles/
          cp candidate/updateweb/manifest.json updates/android/candidate.json
          cp candidate/updateweb/manifest.json candidate/update-manifest.json
          git fetch origin "$GITHUB_REF_NAME"
          git diff --exit-code HEAD FETCH_HEAD -- index.html assets/ mobile/native/ mobile/capacitor.config.json scripts/build-mobile.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/android/candidate.json updates/android/bundles/
          git commit -m "build: stage client address and pharmacy network Android web update [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: client-fields-android-candidate
          path: candidate/update-manifest.json
  installed-android:
    needs: stage-android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: client-fields-android-candidate
          path: candidate
      - run: npm ci
      - name: Preserve exact APK and prepare emulator renderer
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('downloads/traxio-android-testes.apk').read_bytes()).hexdigest()=='6d9fe54fc87beac1e1da5200858ab5232468449f40733548d58ad75139fdcdc2'
          PY
          sudo chmod a+rw /dev/kvm
          Xvfb :99 -screen 0 1920x1200x24 -ac > /tmp/traxelo-fields-xvfb.log 2>&1 &
      - name: Test real HTTPS update in original APK with synthetic data only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 -feature -Vulkan
          script: |
            adb shell wm size 1200x1920
            adb shell wm density 240
            adb install downloads/traxio-android-testes.apk
            adb shell am start -n app.traxio.mobile/.MainActivity
            adb shell run-as app.traxio.mobile mkdir -p shared_prefs
            TRAXELO_LOCATION_PROOF=1 TRAXELO_FIELDS_PROOF=1 TRAXELO_VISITS_PROOF=1 node scripts/android-updates.mjs
      - name: Activate only the update proven in installed APK
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git diff --exit-code HEAD FETCH_HEAD -- index.html assets/ mobile/native/ mobile/capacitor.config.json scripts/build-mobile.mjs downloads/traxio-android-testes.apk
          mkdir -p updates/android docs/captures/client-fields-android
          cp candidate/update-manifest.json updates/android/manifest.json
          cp mobile/evidence/* docs/captures/client-fields-android/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/android/manifest.json docs/captures/client-fields-android/
          git commit -m "build: activate Android-tested separated addresses and pharmacy networks [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-fields-installed-android
          path: mobile/evidence/
