name: RotaMapa RM brand, commercial categories and complete Natal districts
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/brand-registry-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rotamapa-brand-registry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm run check && node scripts/check-rotamapa-art.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.registry.config.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: brand-registry-browser
          path: test-results-registry-filters/
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.android/debug.keystore
          key: traxelo-test-debug-signing-v1
      - run: npm ci --prefix mobile --ignore-scripts
      - run: TRAXELO_RELEASE_TAG=brand-registry-1.3.1 TRAXELO_UPDATE_OUTPUT=candidate/updateweb node scripts/build-mobile.mjs
      - run: npx cap sync android
        working-directory: mobile
      - run: bash gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - run: python scripts/verify-brand-registry-apk.py
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk candidate/rotamapa-android-1.3.1-testes.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brand-registry-candidate
          retention-days: 30
          path: candidate/
  publish:
    needs: [browser, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: brand-registry-candidate
          path: candidate
      - name: Publish verified native installer and compatible OTA without replacing an incompatible installer
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p updates/android/bundles
          cp candidate/rotamapa-android-1.3.1-testes.apk downloads/
          cp candidate/updateweb/bundles/* updates/android/bundles/
          cp candidate/updateweb/manifest.json updates/android/manifest.json
          cp candidate/updateweb/manifest.json updates/android/candidate.json
          cp candidate/brand-registry-proof.json docs/brand-registry-release-verification.json
          python - <<'PY'
          import json,shutil
          p=json.load(open('candidate/brand-registry-proof.json'))
          if p['inPlaceUpgradeFromPreviousInstaller']:
            shutil.copyfile('candidate/rotamapa-android-1.3.1-testes.apk','downloads/rotamapa-android-testes.apk')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/rotamapa-android-1.3.1-testes.apk downloads/rotamapa-android-testes.apk updates/android/ docs/brand-registry-release-verification.json
          git commit -m "build: verified RM launcher and registry filters 1.3.1 [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
