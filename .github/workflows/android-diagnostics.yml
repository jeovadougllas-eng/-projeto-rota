name: Compress installed Android visual evidence
on:
  push:
    branches: [dev/traxelo-android-routes]
    paths: ['.github/workflows/android-diagnostics.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix mobile --ignore-scripts
      - name: Produce readable previews of real ADB compositor screenshots
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const sharp=createRequire(new URL('./mobile/package.json',import.meta.url))('sharp');
          for(const name of ['android-tablet-portrait-route','android-tablet-landscape-route','android-tablet-keyboard','android-google-maps']){
            await sharp('docs/captures/android/'+name+'.png').resize({width:1200,withoutEnlargement:true}).jpeg({quality:82}).toFile('docs/captures/android/'+name+'.jpg');
          }
          NODE
      - name: Preserve visual evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/captures/android/*.jpg
          git commit -m "test: retain real Android compositor previews [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
