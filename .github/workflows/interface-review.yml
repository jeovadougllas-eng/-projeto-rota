name: Traxio interface review
on:
  push:
    branches: [dev/traxio-mockup-fidelity]
  workflow_dispatch:
    inputs:
      refresh_snapshots:
        description: Regenerate visual captures for an intentional visual change
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: traxio-interface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-review:
    if: ${{ !contains(github.event.head_commit.message, '[geolocation probe]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Measure the previous interface against the new supplied kit
        run: |
          git fetch --depth=1 origin 666c21a59af996b8e94b5a8faf130529d763b6c5
          mkdir -p /tmp/traxio-before-kit
          git archive 666c21a59af996b8e94b5a8faf130529d763b6c5 | tar -x -C /tmp/traxio-before-kit
          PORT=4174 node /tmp/traxio-before-kit/scripts/serve.mjs &
          baseline_server_pid=$!
          trap 'kill "$baseline_server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 0.1
          done
          TRAXIO_REVIEW_ORIGIN=http://127.0.0.1:4174 TRAXIO_REFERENCE_OUTPUT=docs/captures/reference-before-kit npx playwright test --config=playwright.reference.config.js
      - name: Compare directly with the immutable approved mockup
        run: npx playwright test --config=playwright.reference.config.js
      - name: Summarize before/after pixel differences
        run: node scripts/summarize-reference.mjs
      - name: Store approved-reference comparison evidence
        if: success() && github.ref == 'refs/heads/dev/traxio-mockup-fidelity'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/captures/reference/ docs/captures/reference-before-kit/ docs/captures/reference-summary.*
          if ! git diff --cached --quiet; then
            git commit -m "test: compare application with approved reference [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify core flows before the full matrix
        run: npm test -- --project=desktop-light tests/auth.spec.js tests/flows.spec.js
      - name: Browser matrix and visual regression checks
        run: |
          if [ "${{ inputs.refresh_snapshots || contains(github.event.head_commit.message, '[refresh snapshots]') }}" = "true" ]; then
            npm test -- --update-snapshots
          else
            npm test
          fi
      - name: Retest the newly captured screens without accepting differences
        if: inputs.refresh_snapshots || contains(github.event.head_commit.message, '[refresh snapshots]')
        run: npm test -- tests/visual.spec.js tests/dialogs.visual.spec.js --output=test-results-retest --reporter=list
      - name: Store captures on the development branch for visual review
        if: success() && github.ref == 'refs/heads/dev/traxio-mockup-fidelity'
        run: |
          mkdir -p docs/captures
          for theme in light dark; do
            capture=$(find test-results -path "*desktop-${theme}/mapa-real.png" -print -quit)
            if [ -n "$capture" ]; then
              cp "$capture" "docs/captures/mapa-real-${theme}.png"
            fi
          done
          mkdir -p docs/captures/live-maps
          for viewport in desktop tablet-landscape tablet-portrait phone; do
            for theme in light dark; do
              capture=$(find test-results -path "*${viewport}-${theme}/mapa-real.png" -print -quit)
              if [ -n "$capture" ]; then cp "$capture" "docs/captures/live-maps/${viewport}-${theme}.png"; fi
            done
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/*-snapshots/ docs/captures/
          if ! git diff --cached --quiet; then
            git commit -m "test: capture Traxio interface for visual review [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Preserve screenshots and report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traxio-interface-review
          retention-days: 14
          path: |
            docs/captures/reference/
            docs/captures/reference-before-kit/
            docs/captures/reference-summary.*
            test-results-reference/
            test-results-retest/
            playwright-report/
            test-results/
            tests/*-snapshots/
